stages:
  - build
  - test
  - deploy

# DUCT-TAPE: Retry clone in case of race condition.
variables:
  GET_SOURCES_ATTEMPTS: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3

build:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache openjdk8 plantuml bash gawk pandoc imagemagick minify libxml2 libxml2-utils
  script:
    - ./daemon.sh -o
  artifacts:
    paths:
      - public
    expire_in: 1w

test:
  stage: test
  image:
    name: lycheeverse/lychee:0.24.2-alpine
    entrypoint: [""]
    docker:
      user: root
  needs: [build]
  before_script:
    - apk add --no-cache libxml2-utils
  script:
    - sh .util/test.sh

pages:
  stage: deploy
  image: alpine:latest
  needs: [build, test]
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Deploying public/ to GitLab Pages"
  artifacts:
    paths:
      - public
    expire_in: 1d
  rules:
    # (ensures that only pushes to the default branch will trigger a pages deploy)
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

