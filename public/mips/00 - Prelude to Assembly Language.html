<!DOCTYPE html> <html xmlns="http://www.w3.org/1999/xhtml" lang="" xml:lang=""> <head>  <meta charset="utf-8" />  <meta name="generator" content="pandoc" />  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />  <title>Prelude</title>  <link rel="stylesheet" type="text/css" href="../../style.min.css"> <!--[if lt IE 9]>     <script src="//cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv-printshiv.min.js"></script> <![endif]--> </head> <body>  <header id="title-block-header">  <h1 class="title">Prelude</h1>  </header>  <blockquote>  <p><strong>Motive</strong>: Studying MIPS improves understanding of all assembly languages.</p>  <ul class="incremental">  <li><em>Metaphor: You don’t re-learn how to drive every time you buy a new car.</em></li>  </ul>  </blockquote>  <!--  **Architecture**: Logical description of a computer's basic components and operations.  - Unique to each processor family.  - Each architecture has its own assembly language.   **Machine Cycle**: One machine cycle results in the execution of one machine instruction.  - *(Fetch-Decode-Execute cycle)*   **Register**: Part of the processor than can hold a bit pattern representing some data.   > **Note**: Enhanced assembly language includes pseudoinstructions that make life easier.   **Machine Instruction**: Pattern of bits that corresponds to a fundamental operation of the processor.  - Addition and subtraction can be performed in one machine cycle, but loops and branches alter the cycle.  - On MIPS32, each instruction is 32 bits long.   > **Example**: A machine instruction  > - MIPS Assembly: `add $t0,$t1,$t2`{.mips}  > - Machine Instruction: `0000 0001 0010 1011 1000 0000 0010 0000`  >  > *(Translation of MIPS assembly $\to$ machine instructions is done by an **assembler**)*  -->  <footer>  <p>  <i><a href="https://inevitabby.codeberg.page/notes/about.html">About</a></i>  </p>  </footer>     <script>  function toggleNavbar() { const TOC = document.querySelector('#TOC'); TOC.style.display = TOC.style.display === "none" ? "block" : "none"; }  let isFirstAnchorClick = false; document.querySelectorAll("a[href^=\"#\"]").forEach(function (anchor) { anchor.addEventListener("click", function (event) { event.preventDefault(); const TARGET_HREF = anchor.getAttribute('href'); history.replaceState(null, null, TARGET_HREF); window.location.href = TARGET_HREF; if (!isFirstAnchorClick) {  history.pushState({ originalUrl: window.location.href }, document.title, window.location.href); isFirstAnchorClick = true; } }); });  </script></body> </html>
