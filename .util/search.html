<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Search Notes</title>
    <script src="lunr.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
    body {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: var(--background-color);
        color: var(--text-color);
    }
    .search-box {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        margin-bottom: 20px;
    }
    .result {
        border-bottom: 1px solid var(--blockquote-border-color);
        padding: 10px 0;
    }
    .result-title {
        font-weight: bold;
        color: var(--link-color);
    }
    .result-category {
        color: var(--TOC-text-color);
        font-size: 0.9em;
    }
    .result-snippet {
        color: var(--text-color);
        margin-top: 5px;
    }
    .no-results {
        color: var(--TOC-text-color);
        font-style: italic;
    }
    </style>
</head>
<body>
        <nav id=breadcrumbs><a href=../>Home</a> > Search</nav>
    <h1 class="title">Search Notes</h1>
    <input type="text" class="search-box" placeholder="Type to search..." id="searchInput" autofocus>
    <div id="results"></div>
    <script src="search-index.js"></script>
    <script src="search.js"></script>
    <script>
        // Initialize theme
        if (localStorage.theme === 'dark' || (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        // Toggle theme
        function toggleDarkMode() {
          const root = document.documentElement;
          const isDark = root.classList.toggle('dark');
          localStorage.theme = isDark ? 'dark' : 'light';
        }
    </script>
</body>
</html>
